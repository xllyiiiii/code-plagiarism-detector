{% extends "base.html" %}
{% block title %}创建课程{% endblock %}
{% block content %}
<div class="form-container">
    <h2>创建课程</h2>
    <form method="POST">
        <div class="form-group">
            <label>课程名称 <span style="color:red">*</span></label>
            <input type="text" name="name" required placeholder="例如：2026 春 · 数据结构">
        </div>
        <div class="form-group">
            <label>学期</label>
            <input type="text" name="semester" placeholder="例如：2025-2026-2">
        </div>
        <div class="form-group">
            <label>课程描述</label>
            <textarea name="description" rows="3" placeholder="简要描述课程内容和目标"></textarea>
        </div>
        <button type="submit">创建课程</button>
    </form>
    <p class="form-footer">
        <a href="{{ url_for('courses.index') }}">← 返回课程列表</a>
    </p>
</div>
{% endblock %}
