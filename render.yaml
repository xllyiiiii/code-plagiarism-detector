services:
  - type: web
    name: code-plagiarism-detector
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: plagiarism-db
          property: connectionString

databases:
  - name: plagiarism-db
    plan: free
